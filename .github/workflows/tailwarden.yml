name: Tailwarden

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview actions without changing Tailscale state"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 0,12 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: tailwarden-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Run Tailwarden keepalive
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      TAILNET: ${{ vars.TAILNET || '-' }}
      TS_CLIENT_ID: ${{ vars.TS_MANAGER_CLIENT_ID }}
      TS_AUDIENCE: ${{ vars.TS_MANAGER_AUDIENCE }}
      SERVER_TAG: ${{ vars.SERVER_TAG }}
      REJOIN_AUTH_KEY_TAG: ${{ vars.REJOIN_AUTH_KEY_TAG }}
      STALE_AFTER_MINUTES: ${{ vars.STALE_AFTER_MINUTES || '30' }}
      KEY_EXPIRY_WARNING_HOURS: ${{ vars.KEY_EXPIRY_WARNING_HOURS || '168' }}
      AUTH_KEY_EXPIRY_SECONDS: ${{ vars.AUTH_KEY_EXPIRY_SECONDS || '3600' }}
      REPORT_REDACT_DETAILS: "true"
      REPORT_DEVICE_NAMES: "true"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      FAIL_ON_STALE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Keep servers connected
        id: keepalive
        run: uv run --frozen --no-dev tailwarden run
